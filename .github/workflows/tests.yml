name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install dependencies
        run: |
          composer install --no-progress --prefer-dist

      - name: Run PHP Lint
        run: |
          find . -name "*.php" ! -path "./vendor/*" ! -path "./.git/*" -exec php -l {} \;

  test:
    runs-on: ubuntu-latest
    needs: lint
    
    strategy:
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2']
        nextcloud-version: ['29', '30', '31', '32']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Install dependencies
        run: |
          composer install --no-progress --prefer-dist

      - name: Run PHPUnit tests
        run: |
          vendor/bin/phpunit --testdox
        env:
          NC_VERSION: ${{ matrix.nextcloud-version }}

      - name: Generate coverage report
        if: matrix.php-version == '8.1' && matrix.nextcloud-version == '32'
        run: |
          vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1' && matrix.nextcloud-version == '32'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-php${{ matrix.php-version }}
          path: coverage/
          if-no-files-found: warn
          retention-days: 30
