name: Build and Sign Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          # Create clean copy without development files
          mkdir -p /tmp/build
          rsync -av --exclude='.git' --exclude='.github' --exclude='.gitignore' \
            --exclude='update-server.sh' --exclude='CODE_SIGNING.md' \
            --exclude='RELEASING.md' --exclude='*.key' --exclude='vendor' \
            --exclude='.phpunit.result.cache' --exclude='composer.lock' \
            . /tmp/build/digitalsignage/
          cd /tmp/build
          tar -czf digitalsignage-${{ steps.version.outputs.version }}.tar.gz digitalsignage/
          # Move back to workspace
          mv digitalsignage-${{ steps.version.outputs.version }}.tar.gz $GITHUB_WORKSPACE/

      - name: Setup signing environment
        run: |
          echo "${{ secrets.CODESIGN_KEY }}" > certificates/digitalsignage.key
          chmod 600 certificates/digitalsignage.key

      - name: Sign release archive
        run: |
          openssl dgst -sha512 -sign certificates/digitalsignage.key digitalsignage-${{ steps.version.outputs.version }}.tar.gz | openssl base64 > digitalsignage-${{ steps.version.outputs.version }}.tar.gz.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            digitalsignage-${{ steps.version.outputs.version }}.tar.gz
            digitalsignage-${{ steps.version.outputs.version }}.tar.gz.sig
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare for App Store
        run: |
          echo "Release digitalsignage-${{ steps.version.outputs.version }} is ready for App Store submission"
          echo "Archive: digitalsignage-${{ steps.version.outputs.version }}.tar.gz"
          echo "Signature: $(cat digitalsignage-${{ steps.version.outputs.version }}.tar.gz.sig)"

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f certificates/digitalsignage.key
          rm -f *.sig
