name: Validate Screenshots

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Validate screenshots (existence, format, size)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image

          files = [
              Path('img/screenshot-display.png'),
              Path('img/screenshot-settings-1.png'),
              Path('img/screenshot-settings-2.png'),
              Path('img/screenshot-settings-3.png'),
              Path('img/screenshot-tokens.png'),
          ]

          MIN_W, MIN_H = 800, 600
          errors = []

          for f in files:
              if not f.exists():
                  errors.append(f"Missing screenshot: {f}")
                  continue
              try:
                  with Image.open(f) as img:
                      w, h = img.size
                      fmt = img.format
                      if fmt != 'PNG':
                          errors.append(f"{f}: must be PNG (found {fmt})")
                      if w < MIN_W or h < MIN_H:
                          errors.append(f"{f}: too small {w}x{h}, need >= {MIN_W}x{MIN_H}")
              except Exception as e:
                  errors.append(f"{f}: cannot open ({e})")

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('All screenshots present, PNG, and meet size requirements.')
          PY

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Screenshots valid"
          else
            echo "❌ Screenshot validation failed"
          fi
