name: Release and Upload to App Store

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-sign-release-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release archive
        run: |
          mkdir -p /tmp/release
          cp -r . /tmp/release/digitalsignage
          cd /tmp/release/digitalsignage
          rm -rf .git .github .gitignore update-server.sh CODE_SIGNING.md RELEASING.md
          find . -name "*.key" -delete
          cd /tmp/release
          tar -czf digitalsignage-${{ steps.version.outputs.version }}.tar.gz digitalsignage/
          mv digitalsignage-${{ steps.version.outputs.version }}.tar.gz $GITHUB_WORKSPACE/

      - name: Setup signing environment
        run: |
          echo "${{ secrets.CODESIGN_KEY }}" > certificates/digitalsignage.key
          chmod 600 certificates/digitalsignage.key

      - name: Sign release archive
        run: |
          openssl dgst -sha512 -sign certificates/digitalsignage.key digitalsignage-${{ steps.version.outputs.version }}.tar.gz | openssl base64 > digitalsignage-${{ steps.version.outputs.version }}.tar.gz.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            digitalsignage-${{ steps.version.outputs.version }}.tar.gz
            digitalsignage-${{ steps.version.outputs.version }}.tar.gz.sig
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Nextcloud App Store
        env:
          NC_APPSTORE_TOKEN: ${{ secrets.NC_APPSTORE_TOKEN }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          ./scripts/upload-to-appstore.sh "$VERSION"

      - name: Clean up sensitive files
        if: always()
        run: |
          rm -f certificates/digitalsignage.key
          rm -f *.sig
