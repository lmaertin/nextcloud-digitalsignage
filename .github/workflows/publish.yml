name: Publish to App Store

on:
  release:
    types: [published]

jobs:
  publish-app-store:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get release info
        id: release
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF" >> $GITHUB_OUTPUT

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts

      - name: Prepare submission
        run: |
          # Create submission package with all required files
          mkdir -p submission
          
          # Copy app archive and signature
          cp digitalsignage-${{ steps.release.outputs.version }}.tar.gz submission/
          cp digitalsignage-${{ steps.release.outputs.version }}.tar.gz.sig submission/
          
          # Copy changelog
          cp CHANGELOG.md submission/
          
          # Copy screenshots
          cp img/screenshot-*.png submission/ 2>/dev/null || true
          
          echo "Submission package ready for App Store"
          echo "Files in submission/"
          ls -la submission/

      - name: Validate submission
        run: |
          # Check that all required files exist
          echo "Checking submission files..."
          
          if [ ! -f "submission/digitalsignage-${{ steps.release.outputs.version }}.tar.gz" ]; then
            echo "ERROR: Archive not found"
            exit 1
          fi
          
          if [ ! -f "submission/digitalsignage-${{ steps.release.outputs.version }}.tar.gz.sig" ]; then
            echo "ERROR: Signature not found"
            exit 1
          fi
          
          echo "Submission validation passed"

      - name: Upload to App Store (Manual)
        run: |
          cat > /tmp/app-store-info.txt << EOF
          App Store Submission Ready
          ===========================
          
          Version: ${{ steps.release.outputs.version }}
          
          Release artifacts are available in the GitHub Release:
          https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.version }}
          
          To submit to App Store:
          1. Go to https://apps.nextcloud.com/developer/apps/digitalsignage
          2. Click "Upload new release"
          3. Upload digitalsignage-${{ steps.release.outputs.version }}.tar.gz
          4. Paste the signature from digitalsignage-${{ steps.release.outputs.version }}.tar.gz.sig
          5. Add changelog from CHANGELOG.md
          6. Upload screenshots from img/
          7. Submit for approval
          
          EOF
          
          cat /tmp/app-store-info.txt

      - name: Post release comment
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## App Store Submission Ready\n\nVersion ${{ steps.release.outputs.version }} is ready for Nextcloud App Store submission.\n\n**Manual steps required:**\n1. Visit https://apps.nextcloud.com/developer/apps/digitalsignage\n2. Upload the archive and signature from this release\n3. Add changelog notes\n4. Upload screenshots\n5. Submit for review`
            })
