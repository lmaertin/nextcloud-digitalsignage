
name: Upload to Nextcloud App Store

on:
  release:
    types: [published]

jobs:
  upload-appstore:
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive
        run: |
          TAG_NAME=${{ github.event.release.tag_name }}
          wget -O digitalsignage-${TAG_NAME#v}.tar.gz "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/digitalsignage-${TAG_NAME#v}.tar.gz"
          wget -O digitalsignage-${TAG_NAME#v}.tar.gz.sig "https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/digitalsignage-${TAG_NAME#v}.tar.gz.sig"
      - name: Upload to Nextcloud App Store
        env:
          NC_APPSTORE_TOKEN: ${{ secrets.NC_APPSTORE_TOKEN }}
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          ./scripts/upload-to-appstore.sh "$VERSION"
