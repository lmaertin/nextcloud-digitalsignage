

name: Upload to Nextcloud App Store

on:
  workflow_run:
    workflows: ["Build and Sign Release"]
    types:
      - completed

jobs:
  upload-appstore:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: .
      - name: Upload to Nextcloud App Store
        env:
          NC_APPSTORE_TOKEN: ${{ secrets.NC_APPSTORE_TOKEN }}
        run: |
          VERSION=$(echo "${{ github.event.workflow_run.head_branch }}" | sed 's/^v//')
          ./scripts/upload-to-appstore.sh "$VERSION"
